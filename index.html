<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletrocell - Ordem de Serviço</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0d">
</head>
<body>

    <div class="main-wrapper">
        <div class="card">
            
            <!-- Logo e Título da Aplicação -->
            <div class="header">
                <div class="logo-wrapper">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="5" y="2" width="14" height="20" rx="3" stroke="#E66721" stroke-width="2" fill="none" />
                        <path d="M7.5 7.5C8.8 6.2 10.3 5.5 12 5.5C13.7 5.5 15.2 6.2 16.5 7.5" stroke="#E66721" stroke-width="1.8" stroke-linecap="round" />
                        <path d="M9.2 10.2C10 9.4 11 9 12 9C13 9 14 9.4 14.8 10.2" stroke="#E66721" stroke-width="1.8" stroke-linecap="round" />
                        <path d="M10.8 13C11.1 12.7 11.5 12.5 12 12.5C12.5 12.5 12.9 12.7 13.2 13" stroke="#E66721" stroke-width="1.8" stroke-linecap="round" />
                        <circle cx="12" cy="16.5" r="1" fill="#E66721" />
                    </svg>
                </div>
                <h1>ELETROCELL ⚡</h1>
                <span class="section-title">| Ordem de Serviço (O.S.) |</span>
            </div>

            <!-- Cabeçalho Informativo da Loja -->
            <div class="os-header-box">
                <div class="os-store-name">ELETROCELL ⚡ — ASSISTÊNCIA DE CELULARES</div>
                <div class="os-store-info">
                    <span>📍 Av. Getúlio Vargas, nº 40, Conceição do Jacuípe - BA</span>
                    <span>💬 WhatsApp: <a href="https://wa.me/5575981718671" class="os-whatsapp-link" target="_blank">(75) 98171-8671</a></span>
                </div>
            </div>

            <!-- Formulário de Entrada -->
            <form id="osForm" class="os-container">
                <div class="form-grid">
                    <div class="os-field">
                        <label for="osNum">Nº DA O.S.</label>
                        <input type="text" id="osNum" placeholder="Ex: 001" required>
                    </div>

                    <div class="os-field">
                        <label for="osData">DATA DE ENTRADA</label>
                        <input type="date" id="osData" required>
                    </div>

                    <div class="os-field">
                        <label for="osAtendente">ATENDENTE RESPONSÁVEL</label>
                        <input type="text" id="osAtendente" placeholder="Nome do atendente" required>
                    </div>

                    <div class="os-field">
                        <label for="osPrevisao">PREVISÃO DE ENTREGA</label>
                        <input type="date" id="osPrevisao">
                    </div>
                </div>

                <div class="os-section-title">Dados do Cliente</div>

                <div class="form-grid">
                    <div class="os-field full">
                        <label for="clienteNome">NOME COMPLETO</label>
                        <input type="text" id="clienteNome" placeholder="Nome do cliente" required>
                    </div>

                    <div class="os-field">
                        <label for="clienteTel">TELEFONE / WHATSAPP</label>
                        <input type="tel" id="clienteTel" placeholder="(75) 99999-9999" required>
                    </div>

                    <div class="os-field">
                        <label for="clienteCpf">CPF</label>
                        <input type="text" id="clienteCpf" placeholder="000.000.000-00">
                    </div>
                </div>

                <div class="os-section-title">Dados do Aparelho</div>

                <div class="form-grid">
                    <div class="os-field">
                        <label for="aparelhoModelo">MODELO</label>
                        <input type="text" id="aparelhoModelo" placeholder="Ex: iPhone 15 Pro Max" required>
                    </div>

                    <div class="os-field">
                        <label for="aparelhoCor">COR</label>
                        <input type="text" id="aparelhoCor" placeholder="Ex: Cinza">
                    </div>

                    <div class="os-field">
                        <label for="aparelhoImei">IMEI / SÉRIE</label>
                        <input type="text" id="aparelhoImei" placeholder="Número do IMEI">
                    </div>

                    <div class="os-field">
                        <label for="aparelhoSenha">SENHA DO APARELHO</label>
                        <input type="text" id="aparelhoSenha" placeholder="Senha numérica ou padrão">
                    </div>

                    <div class="os-field">
                        <label for="aparelhoBateria">BATERIA (%)</label>
                        <div class="bateria-input-wrapper">
                            <input type="number" id="aparelhoBateria" min="0" max="100" placeholder="100">
                            <span class="bateria-suffix">%</span>
                        </div>
                    </div>

                    <div class="os-field full">
                        <label for="aparelhoAvarias">AVARIAS / ESTADO FÍSICO</label>
                        <textarea id="aparelhoAvarias" placeholder="Riscos, trincados, marcas de queda..."></textarea>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" onclick="gerarOS()">GERAR ORDEM DE SERVIÇO</button>
                </div>
            </form>

            <!-- Área de Preview do Texto / Ações -->
            <div id="previewArea" style="display: none;" class="preview-container">
                <div class="os-section-title">Resumo da O.S.</div>
                <div id="previewBox" class="preview-box"></div>

                <div class="preview-buttons">
                    <button class="pdf-btn" onclick="window.print()">🖨️ IMPRIMIR / SALVAR PDF</button>
                    <button class="whatsapp-btn" onclick="enviarWhatsapp()">💬 ENVIAR VIA WHATSAPP</button>
                    <button class="copy-btn" onclick="copiarTexto()">📋 COPIAR TEXTO</button>
                    <button class="edit-btn" onclick="editarOS()">✏️ EDITAR</button>
                    <button class="new-btn" onclick="novaOS()">➕ NOVA O.S.</button>
                </div>
            </div>

            <!-- Área oculta de impressão (A4) -->
            <div id="pdfSheet" class="pdf-print-sheet"></div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('SW registrado:', registration))
                    .catch(err => console.log('Erro SW:', err));
            });
        }
    </script>
</body>
</html>
